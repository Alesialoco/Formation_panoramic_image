[RTSP]
url1 = rtsp://localhost:8554/camera1
url2 = rtsp://localhost:8555/camera2

[MODEL]
path = yolov8n.pt

[DETECTION]
confidence = 0.5

[STITCHING]
overlap_percentage = 25
resolution_width = 640
resolution_height = 480
stitch_mode = 'SCANS'

[OUTPUT]
display_width = 1200
display_height = 600
show_individual_cameras = true

[CALIBRATION]
use_undistortion = true
use_enhancement = true
calibration_file = camera_calibration.pkl
